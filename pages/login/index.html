<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any">
 <title>ログイン | TEAMSPIRIT-jp</title>
 <meta name="robots" content="noindex,follow">
 <link rel="canonical" href="https://teamspiritsport.jp/pages/login/">
 <link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="/assets/order-flow.css?v=20260724-3"><link rel="stylesheet" href="/assets/support-chat.css?v=20260815-8"></head>
<body>
 <header class="page-head"><span class="brand">TEAMSPIRIT-jp</span><a class="back" href="../../">← ホームへ</a></header>
 <main class="login-page">
 <section class="login-panel" aria-labelledby="login-title">
 <h1 id="login-title"> ログイン</h1>
 <form class="login-form" id="login-form">
 <div class="login-fields">
 <label><span hidden>ID</span><input name="username" autocomplete="username" placeholder="ID" required></label>
 <label><span hidden>パスワード</span><input type="password" name="password" autocomplete="current-password" placeholder="パスワード" required></label>
 </div>
 <button class="primary-login" type="submit">ログイン</button>
 </form>
 <div class="login-links">
 <label class="remember"><input type="checkbox" name="remember"> ID 保存</label>
 <nav aria-label="ウォン "><a href="../signup/">新規登録</a><a href="#">ID検索</a><a href="#">パスワード検索</a></nav>
 </div>

 <h2> ログイン</h2>
 <div class="social-logins">
 <button class="social-login line" type="button" data-provider="LINE"><span class="social-mark" aria-hidden="true"></span><span>LINE ログイン</span></button>
 <button class="social-login google" type="button" data-provider="Google"><span class="social-mark" aria-hidden="true">G</span><span>Google ログイン</span></button>
 <button class="social-login naver" type="button" data-provider="Naver"><span class="social-mark" aria-hidden="true">N</span><span> ログイン</span></button>
 </div>
 <a class="guest-order" href="../orders/">ウォン 注文配送照会 &gt;</a>
 <p class="auth-note"> ログイン OAuth 接続 . ブラウザー ストレージ 保存 .</p>
 <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
 </section>
 </main>
 <script>
 const status = document.getElementById('auth-status');
 document.getElementById('login-form').addEventListener('submit', event => {
 event.preventDefault();
 status.textContent = ' ログイン サーバー 接続 準備 あります.';
 });
 document.querySelectorAll('[data-provider]').forEach(button => {
 button.addEventListener('click', () => {
 status.textContent = `${button.dataset.provider} OAuth 接続 準備 あります.`;
 });
 });
 </script>
<script src="/assets/order-config.js"></script><script src="/assets/order-flow.js?v=20260724-8" defer></script><script src="/assets/support-chat-config.js?v=20260815-8"></script><script src="/assets/support-chat.js?v=20260815-8" defer></script></body>
</html>
