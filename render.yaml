services:
  - type: web
    name: teamspirit-jp-admin
    runtime: python
    plan: free
    rootDir: admin_backend
    buildCommand: python -m py_compile server.py seo_generator.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: TEAMSPIRIT_ONLINE
        value: "1"
      - key: TEAMSPIRIT_ADMIN_ORIGIN
        value: https://teamspiritsport.jp
      - key: TEAMSPIRIT_ADMIN_USERNAME
        value: admin
      - key: TEAMSPIRIT_ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
