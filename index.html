(function(){
 function koreaTimeTheme(){
 try{
 var hour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hour:"numeric",hour12:false}).format(new Date()));
 return (hour>=6&&hour<18)?"day":"night";
 }catch(_error){
 var localHour=new Date().getHours();
 return (localHour>=6&&localHour<18)?"day":"night";
 }
 }
 function applyTheme(){
 var theme=koreaTimeTheme();
 try{
 var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
 if(media&&media.media!=="not all"){
 theme=media.matches?"night":"day";
 }
 }catch(_error){}
 document.documentElement.dataset.theme=theme;
 }
 applyTheme();
 try{
 var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
 if(media&&media.addEventListener)media.addEventListener("change",applyTheme);
 else if(media&&media.addListener)media.addListener(applyTheme);
 }catch(_error){}
 setInterval(applyTheme,300000);
})();
</script>

 function ensureCommerceUI(){if(document.getElementById("productOptionsModal"))return;document.body.insertAdjacentHTML("beforeend",`<div class="commerce-modal" id="productOptionsModal" hidden onclick="if(event.target===this)closeCommerceModal('productOptionsModal')"><section class="commerce-panel option-panel" role="dialog" aria-modal="true" aria-labelledby="optionTitle"><header><h2 id="optionTitle">オプション選択</h2><button type="button" onclick="closeCommerceModal('productOptionsModal')" aria-label="閉じる">×</button></header><div id="optionProduct"></div><div class="option-group"><b>サイズ</b><div class="option-sizes" id="optionSizes"></div></div><div class="option-quantity"><label for="optionQuantity">数量</label><input id="optionQuantity" type="number" min="1" max="99" value="1"></div><p class="commerce-status" id="optionStatus">サイズを選択してください。</p><footer><button class="commerce-secondary" type="button" onclick="closeCommerceModal('productOptionsModal')">キャンセル</button><button class="commerce-primary" type="button" onclick="addSelectedToCart()">カートに入れる</button></footer></section></div><div class="commerce-modal" id="cartModal" hidden onclick="if(event.target===this)closeCommerceModal('cartModal')"><section class="commerce-panel cart-panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle"><header><h2 id="cartTitle">カート</h2><button type="button" onclick="closeCommerceModal('cartModal')" aria-label="閉じる">×</button></header><div class="cart-list" id="cartList"></div><div class="cart-summary" id="cartSummary"></div><div class="cart-order-actions"><button class="checkout ts-cart-checkout" type="button" onclick="openTeamspiritStoredCartOrder()">注文する</button><button class="instagram" type="button" onclick="openFloatingContact('instagram')">Instagramで注文</button><a class="line" href="${LINE_LINK}" target="_blank" rel="noopener">LINEで注文</a></div></section></div>`)}

};

  const isSet = (type === "set");
  const isShirt = (type === "shirt");
  const isPants = (type === "pants");

  const curEl = document.getElementById("detailPrice");
  const oldEl = document.getElementById("detailOldPrice");
  const saleEl = document.getElementById("detailSale");
  const noteEl = document.getElementById("detailPriceNote");
  const totalEl = document.querySelector(".detail .total span:last-child");

  let curText = "¥4,800";
  let oldText = "¥9,600";
  let saleText = "50%";
  let noteText = "<strong>【上下セット（シャツ＋パンツ）価格】</strong> ※ 表示価格にパンツが含まれています。チーム名・背番号・ロゴの昇華プリント代もすべて込み。（シャツ単品 ¥3,500 / パンツ単品 ¥2,000）";

  if (isShirt) {
    curText = "¥3,500";
    oldText = "¥5,500";
    saleText = "36%";
    noteText = "<strong>【シャツ単品価格】</strong> ※ シャツのみの価格です（パンツ別売）。チーム名・背番号・ロゴの昇華プリント代込み。";
  } else if (isPants) {
    curText = "¥2,000";
    oldText = "¥4,000";
    saleText = "50%";
    noteText = "<strong>【パンツ単品価格】</strong> ※ ハーフパンツのみの価格です（シャツ別売）。チーム番号・ロゴプリント代込み。";
  }

  if (curEl) curEl.textContent = curText;
  if (oldEl) oldEl.textContent = oldText;
  if (saleEl) saleEl.textContent = saleText;
  if (noteEl) noteEl.innerHTML = noteText;
  if (totalEl) totalEl.textContent = curText;

  document.querySelectorAll(".detail .set-option-btn").forEach((btn, idx) => {
    const active = (idx === 0 && isSet) || (idx === 1 && isShirt) || (idx === 2 && isPants);
    btn.classList.toggle("active", active);
    const icon = btn.querySelector(".set-radio-icon");
    if (icon) icon.textContent = active ? "●" : "○";
  });
};
