<script>
(function(){
  function koreaTimeTheme(){
    try{
      var hour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hour:"numeric",hour12:false}).format(new Date()));
      return (hour>=6&&hour<18)?"day":"night";
    }catch(_error){
      var localHour=new Date().getHours();
      return (localHour>=6&&localHour<18)?"day":"night";
    }
  }
  function applyTheme(){
    var theme=koreaTimeTheme();
    try{
      var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
      if(media&&media.media!=="not all"){
        theme=media.matches?"night":"day";
      }
    }catch(_error){}
    document.documentElement.dataset.theme=theme;
  }
  applyTheme();
  try{
    var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
    if(media&&media.addEventListener)media.addEventListener("change",applyTheme);
    else if(media&&media.addListener)media.addListener(applyTheme);
  }catch(_error){}
  setInterval(applyTheme,300000);
})();
</script>

  function renderProductReviews(product){const container=document.querySelector(".review-card");if(!container)return;const reviews=Array.isArray(product.reviews)?product.reviews.filter(review=>review&&(review.text||(Array.isArray(review.images)&&review.images.length))):[];container.className="product-reviews";container.innerHTML=reviews.map(review=>{const stars=Math.max(0,Math.min(5,Number(review.stars)||0));const images=Array.isArray(review.images)?review.images.filter(Boolean):[];const author=review.author?`<small class="product-review-author">${attr(review.author)}${review.date?` - ${attr(review.date)}`:""}</small>`:"";const rating=stars?`${"\u2605".repeat(stars)}${"\u2606".repeat(5-stars)}`:"Review note";const label=stars?`${stars} of 5 rating`:"Review note without rating";return `<article class="product-review"><div class="product-review-stars" aria-label="${label}">${rating}</div>${review.text?`<p class="product-review-text">${attr(review.text)}</p>`:""}${author}${images.length?`<div class="product-review-images">${images.map((image,index)=>`<img src="${attr(image)}" alt="${attr(product.name||product.id)} feedback image ${index+1}" loading="lazy">`).join("")}</div>`:""}</article>`}).join("")||`<div class="product-review-empty">No real customer feedback has been added yet.</div>`}
