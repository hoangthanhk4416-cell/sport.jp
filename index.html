<script>
(function(){
 function koreaTimeTheme(){
 try{
 var hour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hour:"numeric",hour12:false}).format(new Date()));
 return (hour>=6&&hour<18)?"day":"night";
 }catch(_error){
 var localHour=new Date().getHours();
 return (localHour>=6&&localHour<18)?"day":"night";
 }
 }
 function applyTheme(){
 var theme=koreaTimeTheme();
 try{
 var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
 if(media&&media.media!=="not all"){
 theme=media.matches?"night":"day";
 }
 }catch(_error){}
 document.documentElement.dataset.theme=theme;
 }
 applyTheme();
 try{
 var media=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
 if(media&&media.addEventListener)media.addEventListener("change",applyTheme);
 else if(media&&media.addListener)media.addListener(applyTheme);
 }catch(_error){}
 setInterval(applyTheme,300000);
})();
</script>

.benefits-strip{box-sizing:border-box;width:min(1180px,100%);margin:-28px auto 26px;padding:0 18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.benefit-card{box-sizing:border-box;min-width:0;min-height:86px;display:flex;align-items:center;gap:14px;padding:15px;background:#f7f7f7;border:1px solid #f0f0f0;border-radius:4px;color:#111;text-align:left}
.benefit-icon{width:42px;height:42px;flex:0 0 42px}.benefit-icon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.benefit-copy{min-width:0}.benefit-copy strong{display:block;margin:0 0 3px;font-size:16px;line-height:1.25;white-space:nowrap}.benefit-copy p{margin:0;color:#333;font-size:11px;line-height:1.45}
@media(max-width:620px){.benefits-strip{width:100%;margin:-16px auto 14px;padding:0 4px;gap:4px}.benefit-card{min-height:92px;flex-direction:column;justify-content:flex-start;gap:5px;padding:8px 3px;text-align:center;background:#0d1816;border-color:rgba(255,255,255,.08);color:#fff}.benefit-icon{width:27px;height:27px;flex-basis:27px}.benefit-copy strong{margin-bottom:2px;font-size:9.5px;line-height:1.2;white-space:normal}.benefit-copy p{color:#d7dfdc;font-size:7px;line-height:1.35;overflow-wrap:anywhere}}
 .shortcuts{max-width:none;margin:10px 4px 18px;padding:12px 6px 10px;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
 .shortcut{min-width:0;font-size:7px;line-height:1.2;letter-spacing:-.06em;color:#eaf1ee;text-shadow:0 1px 0 rgba(0,0,0,.4)}
 .shortcut .ico{width:31px;height:29px;margin-bottom:4px;background-size:512px 63px;filter:grayscale(1) brightness(0) invert(1) drop-shadow(0 0 2px rgba(255,255,255,.22))}
 .shortcut-icon-1{background-position:-28px -15px}.shortcut-icon-2{background-position:-90px -15px}.shortcut-icon-3{background-position:-151px -15px}.shortcut-icon-4{background-position:-211px -15px}.shortcut-icon-5{background-position:-271px -15px;filter:none!important}.shortcut-icon-6{background-position:-332px -15px;filter:none!important}.shortcut-icon-7{background-position:-392px -15px}.shortcut-icon-8{background-position:-453px -15px}
 .section{padding:14px 0}
 .center-title{font-size:17px;margin:0 0 10px;color:#fff;letter-spacing:-.4px}
 .carousel-row.popular{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:visible}
 .section .grid,.custom-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:visible}
 .custom-row .card{min-width:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{background:#0c1413;color:#fff;border-radius:6px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
 .pic{background:#17201f;border-radius:5px}
 .card .name,.name{color:#dce4e0;font-size:9px;height:15px;line-height:15px;margin:7px 0 3px;padding:0 2px}
 .card .price{grid-template-columns:1fr;gap:1px;padding:0 2px 8px;min-height:32px}
 .card .price .old{font-size:8px;color:#89948f}
 .card .price .sale{display:none}
 .card .price .current-price{font-size:11px;color:#fff}
 .tools{right:5px;bottom:5px;gap:4px}
 .tool{width:24px;height:24px;font-size:11px;background:rgba(255,255,255,.9)}
 .car-nav{margin-top:9px;color:#dfe7e3;font-size:12px}
 .car-nav button{background:#101918;border-color:rgba(255,255,255,.14);color:#fff;width:29px;height:29px}
 .section-head{display:block;margin-bottom:12px}
 .section h2,.teamkits h2,.video-sec h2{font-size:24px;color:#fff;margin-bottom:12px}
 .tabs{display:flex;gap:6px;overflow:auto;flex-wrap:nowrap;padding-bottom:4px}
 .tab{padding:8px 13px;font-size:10px;background:#101918;border-color:rgba(255,255,255,.12);color:#aab4af;white-space:nowrap}
 .tab.active{background:#fff;color:#111}
 .floating-tools{right:8px;top:50%;bottom:auto;transform:translateY(-50%);grid-template-columns:1fr;gap:10px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none}
 .floating-tool{width:38px;height:38px;border-radius:10px}
 .line-mark{font-size:8px;padding:5px 3px}
 .instagram-mark{width:22px;height:22px;border-width:2px;border-radius:7px}
 .instagram-mark:before{width:7px;height:7px;border-width:2px;left:5px;top:5px}.instagram-mark:after{right:3px;top:3px}
 .floating-tool.cart svg{width:22px;height:22px}
 .footer{margin-top:22px}
}
