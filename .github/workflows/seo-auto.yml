name: SEO Automation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  workflow_dispatch:

concurrency:
  group: seo-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git commit dates
          
      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          
      - name: Run SEO Automation (Sitemap & Audit)
        run: python tools/seo_auto.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml seo-report.json tools/.sitemap-cache.txt || true
          git diff --staged --quiet || git commit -m "chore(seo): update sitemap and seo report" && git push
          
      - name: Submit to Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/google_indexing.py
        
      - name: Ping Search Engines
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://teamspiritsport.jp/sitemap.xml" > /dev/null
          curl -s "https://www.bing.com/ping?sitemap=https://teamspiritsport.jp/sitemap.xml" > /dev/null
          echo "Pinged Google and Bing with new sitemap."
